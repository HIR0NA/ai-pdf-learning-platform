services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pdf_learning_db?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      GROK_MODEL: ${GROK_MODEL:-grok-4.6}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      BAZAARLINK_API_KEY: ${BAZAARLINK_API_KEY:-}
      BAZAARLINK_BASE_URL: ${BAZAARLINK_BASE_URL:-https://api.bazaarlink.ai/v1}
      BAZAARLINK_MODEL: ${BAZAARLINK_MODEL:-qwen/qwen3.7-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      seed:
        condition: service_completed_successfully
    volumes:
      - ./uploads:/app/uploads

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma db push
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pdf_learning_db?schema=public
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: node seed_admin.js
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pdf_learning_db?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pdf_learning_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdf_learning_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
